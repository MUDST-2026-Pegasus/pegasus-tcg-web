apiVersion: v1
kind: Service
metadata:
  name: pegasus-frontend-service
  labels:
    app: pegasus-frontend
    app.kubernetes.io/name: pegasus-tcg-web
    app.kubernetes.io/instance: pegasus-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: pegasus-tcg
spec:
  # LoadBalancer: เผยแพร่ Service สู่ภายนอกคลัสเตอร์ (บน Docker Desktop จะ bind เข้า localhost อัตโนมัติ)
  type: LoadBalancer
  selector:
    app: pegasus-frontend
  ports:
    - name: http
      protocol: TCP
      port: 8081
      targetPort: 80

