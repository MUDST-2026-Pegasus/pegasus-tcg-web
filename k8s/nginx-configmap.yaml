apiVersion: v1
kind: ConfigMap
metadata:
  name: pegasus-frontend-nginx
  labels:
    app: pegasus-frontend
    app.kubernetes.io/name: pegasus-tcg-web
    app.kubernetes.io/instance: pegasus-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: pegasus-tcg
    tier: frontend
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;

        # ส่ง request API ทั้งหมดต่อไปยัง backend service ในคลัสเตอร์
        location /api/ {
            proxy_pass http://pegasus-backend-service:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Origin "";
        }

        # เสิร์ฟ static files ของ React Production Build
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
