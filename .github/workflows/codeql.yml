name: "CodeQL"

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  schedule:
    - cron: "0 3 * * 1,4"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find CodeQL version on runner
        id: codeql-tools
        run: |
          # Requesting the preinstalled version by URL makes the action use the toolcache instead of downloading.
          version="$(ls "$RUNNER_TOOL_CACHE/CodeQL" 2>/dev/null | sort -V | tail -n 1 | cut -d- -f1)"
          if [ -n "$version" ]; then
            echo "url=https://github.com/github/codeql-action/releases/download/codeql-bundle-v${version}/codeql-bundle-linux64.tar.zst" >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize CodeQL
        id: codeql-init
        # A GitHub Releases outage must not fail CI; the last step reports the skipped scan.
        continue-on-error: true
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          tools: ${{ steps.codeql-tools.outputs.url }}

      - name: Perform CodeQL Analysis
        if: steps.codeql-init.outcome == 'success'
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

      - name: Report skipped CodeQL scan
        if: steps.codeql-init.outcome == 'failure'
        run: echo "::warning title=CodeQL skipped::CodeQL could not be initialized, so this run was not scanned."
