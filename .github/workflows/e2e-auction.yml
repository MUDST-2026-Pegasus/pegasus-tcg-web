name: Auction E2E (full stack)

# TCG-641 · QA-1: bid-to-win, buy-now and unpaid-winner against a real API + BE-13 seed.
# Runs the specs AUCTION_ROUNDS times in a row so flakiness shows up in one job.
on:
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "cypress/e2e/auction/**"
      - "scripts/test-auction-e2e.sh"
      - "src/features/auction/**"
      - "src/features/seller/auctions/**"
      - ".github/workflows/e2e-auction.yml"
  workflow_dispatch:
    inputs:
      api_ref:
        description: "pegasus-tcg-api branch to test against"
        default: develop

concurrency:
  group: e2e-auction-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  auction:
    name: Auction E2E x3
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The API repo is private: API_REPO_TOKEN needs read access to MUDST-2026-Pegasus/pegasus-tcg-api.
      - uses: actions/checkout@v4
        with:
          repository: MUDST-2026-Pegasus/pegasus-tcg-api
          ref: ${{ inputs.api_ref || 'develop' }}
          token: ${{ secrets.API_REPO_TOKEN }}
          path: pegasus-tcg-api

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.5
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: cypress-cache-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec cypress install

      - name: Run auction e2e (3 rounds)
        run: bash scripts/test-auction-e2e.sh
        env:
          AUCTION_API_DIR: ${{ github.workspace }}/pegasus-tcg-api
          AUCTION_LOG_DIR: ${{ runner.temp }}/auction-qa
          AUCTION_ROUNDS: "3"

      - name: Upload logs and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: auction-e2e
          path: |
            ${{ runner.temp }}/auction-qa/
            src/test/cypress/screenshots/
          if-no-files-found: ignore
          retention-days: 7
