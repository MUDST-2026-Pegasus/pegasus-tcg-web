name: CI

on:
  push:
    branches: ["main", "develop", "feat/**", "fix/**"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint / Type Check / Tests / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # This job never runs Cypress, so skip its binary download.
          CYPRESS_INSTALL_BINARY: 0

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm exec tsc -b --noEmit

      - name: Run Unit Tests
        run: pnpm test:unit

      - name: Run Integration Tests
        run: pnpm test:integration

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        run: pnpm build

      - name: Upload built site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: built-site
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish web image
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: built-site
          path: image/dist

      - name: Prepare image context
        run: |
          cp Dockerfile.ci image/Dockerfile
          mkdir -p image/nginx
          cp nginx/nginx.conf image/nginx/nginx.conf
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: image
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: Bump image in gitops
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: gitops-bump
      cancel-in-progress: false
    env:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
    steps:
      - name: Check gitops token
        run: ': "${GITOPS_TOKEN:?Set the GITOPS_TOKEN repository secret}"'

      - name: Checkout gitops repo
        uses: actions/checkout@v4
        with:
          repository: MUDST-2026-Pegasus/pegasus-tcg-devops
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}

      # Pin the image the publish job just pushed; Argo CD rolls it out.
      - name: Set image tag
        working-directory: apps/overlays/prod
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          # Only touch this image's newTag line; fail if the entry is missing.
          awk -v img="$IMAGE" -v tag="sha-$GITHUB_SHA" '
            { line = $0; sub(/^[ \t]+/, "", line) }
            line == "- name: " img { hit = 1; print; next }
            hit && line ~ /^newTag:/ { sub(/newTag:.*/, "newTag: " tag); hit = 0; done = 1 }
            { print }
            END { exit !done }
          ' kustomization.yaml > kustomization.yaml.new
          mv kustomization.yaml.new kustomization.yaml
          git diff

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(prod): ${GITHUB_REPOSITORY#*/} sha-${GITHUB_SHA::7}" || exit 0
          # The other app repo may have pushed a bump in the meantime.
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
