name: CI

on:
  push:
    branches: ["main", "develop", "feat/**", "fix/**"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint / Type Check / Tests / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # This job never runs Cypress, so skip its binary download.
          CYPRESS_INSTALL_BINARY: 0

      # ESLint, tsc (tsbuildinfo) and Vite/Vitest caches all live here.
      - name: Cache tool outputs
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache
            node_modules/.tmp
            node_modules/.vite
          key: tools-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            tools-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            tools-${{ runner.os }}-

      - name: Lint
        run: pnpm lint --cache --cache-strategy content --cache-location node_modules/.cache/eslint/

      # i18n [TCG-549]: warning ของ extractor ขึ้นเป็น annotation, key ที่โค้ดใช้ต้อง pull เข้า JSON แล้ว,
      # en ที่ขาดเป็น warning (I18N_STRICT=1 ใน I18N-21 = fail) — ไม่ต่อ Tolgee ไม่ใช้ API key
      - name: i18n extract check
        run: pnpm i18n:extract-check

      - name: i18n check
        run: pnpm i18n:check

      - name: Type check
        run: pnpm exec tsc -b --noEmit

      - name: Run Unit Tests
        run: pnpm test:unit --coverage

      - name: Run Integration Tests
        run: pnpm test:integration

      - name: Publish Unit & Integration Test Results
        if: always()
        continue-on-error: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: FE Unit + Integration
          files: |
            test-results/unit.xml
            test-results/integration.xml
          comment_mode: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'off' || 'always' }}

      - name: Report Vitest Coverage
        if: always()
        continue-on-error: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: FE Unit Coverage
          file-coverage-mode: changes

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: |
            test-results/
            coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        run: pnpm build
        env:
          VITE_FARO_URL: ${{ vars.VITE_FARO_URL || (github.ref_name == 'main' && 'https://pegasus-tcg.gameinwza.com/collect' || 'https://pegasus-dev.gameinwza.com/collect') }}
          VITE_GOOGLE_CLIENT_ID: ${{ github.ref_name == 'main' && vars.VITE_GOOGLE_CLIENT_ID_PROD || vars.VITE_GOOGLE_CLIENT_ID_DEV }}
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_APP_ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

      # build ไม่ใช้ Tolgee API key — กันไว้ถ้ามีคนเผลอใส่ (project key ขึ้นต้นด้วย tgpak_) [TCG-549]
      - name: Check bundle has no Tolgee key
        run: |
          if grep -rlE 'tg(pak|pat)_[A-Za-z0-9]' dist; then
            echo "::error::Tolgee API key found in dist/ — read it only under import.meta.env.DEV (src/lib/i18n/tolgee.ts)"
            exit 1
          fi

      - name: Upload built site
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        uses: actions/upload-artifact@v4
        with:
          name: built-site
          path: dist/
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: Cypress E2E
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      checks: write
      pull-requests: write
    uses: ./.github/workflows/e2e-cypress.yml

  publish:
    name: Publish web image
    needs: [quality, e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: built-site
          path: image/dist

      - name: Prepare image context
        run: |
          cp Dockerfile.ci image/Dockerfile
          mkdir -p image/nginx
          cp nginx/nginx.conf image/nginx/nginx.conf
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: image
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.ref_name == 'main' && 'latest' || 'develop' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: Bump image in gitops
    needs: publish
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: gitops-bump
      cancel-in-progress: false
    env:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
      OVERLAY: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - name: Check gitops token
        run: ': "${GITOPS_TOKEN:?Set the GITOPS_TOKEN repository secret}"'

      - name: Checkout gitops repo
        uses: actions/checkout@v4
        with:
          repository: MUDST-2026-Pegasus/pegasus-tcg-gitops
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}

      # Pin the image the publish job just pushed.
      - name: Set image tag
        working-directory: apps/overlays/${{ env.OVERLAY }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          # Only touch this image's newTag line; fail if the entry is missing.
          awk -v img="$IMAGE" -v tag="sha-$GITHUB_SHA" '
            { line = $0; sub(/^[ \t]+/, "", line) }
            line == "- name: " img { hit = 1; print; next }
            hit && line ~ /^newTag:/ { sub(/newTag:.*/, "newTag: " tag); hit = 0; done = 1 }
            { print }
            END { exit !done }
          ' kustomization.yaml > kustomization.yaml.new
          mv kustomization.yaml.new kustomization.yaml
          git diff

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(${OVERLAY}): ${GITHUB_REPOSITORY#*/} sha-${GITHUB_SHA::7}" || exit 0
          # The other app repo may have pushed a bump in the meantime.
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
