name: Cypress E2E Tests

on:
  pull_request:
    branches: ["main", "develop"]
  workflow_call:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Cypress E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Restore before install: the cypress postinstall downloads the binary.
      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            cypress-cache-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No-op when the cached binary matches; covers a cache miss.
      - name: Install Cypress binary
        run: pnpm exec cypress install

      - name: Build Web Application
        run: pnpm build
        env:
          # Keep unmocked calls off the preview server, as before same-origin builds.
          VITE_API_BASE_URL: http://localhost:8080
          VITE_GOOGLE_CLIENT_ID: cypress-google-client-id

      - name: Start Vite Preview Server
        run: pnpm preview --port 5173 &
        env:
          PORT: 5173

      - name: Wait for Preview Server
        run: npx wait-on http://localhost:5173

      - name: Run Cypress E2E Tests
        run: pnpm exec cypress run --browser chrome --headless --reporter junit --reporter-options "mochaFile=test-results/e2e-[hash].xml"

      - name: Verify Cypress test reports
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 .github/scripts/check_junit.py 'test-results/e2e-*.xml' | tee test-results/cypress-summary.txt

      - name: Check report text for secrets
        id: report-safety
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/check_report_secrets.py test-results

      - name: Publish Cypress E2E Test Results
        if: ${{ !cancelled() && steps.report-safety.outcome == 'success' }}
        continue-on-error: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: FE E2E (Cypress)
          files: test-results/e2e-*.xml
          comment_mode: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && 'always' || 'off' }}

      - name: Upload Cypress result counts
        if: ${{ !cancelled() && steps.report-safety.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: cypress-result-counts
          path: test-results/cypress-summary.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Cypress Screenshots
        if: ${{ failure() && steps.report-safety.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: src/test/cypress/screenshots/
          if-no-files-found: ignore
          retention-days: 7
